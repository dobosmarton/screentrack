[package]
name = "screentrack"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Stable identities for objects detected in screen captures"
repository = "https://github.com/dobosmarton/screentrack"
license = "MIT OR Apache-2.0"
publish = false

[lib]
bench = false
crate-type = ["cdylib", "rlib"]

[[test]]
name = "replay"
required-features = ["trace"]

[[bench]]
harness = false
name = "tracker"

[dependencies]
numpy = { version = "0.30", optional = true }
pyo3 = { version = "0.30", features = ["abi3-py311"], optional = true }

[dev-dependencies]
criterion = "0.8"
proptest = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
python = ["dep:numpy", "dep:pyo3"]
trace = []

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[profile.release]
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
