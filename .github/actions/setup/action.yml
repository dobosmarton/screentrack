name: Set up screentrack
description: Installs Rust tools, the Python environment and the pinned CLIs.

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
      with:
        tool: cargo-binstall,just
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install the pinned tools
      shell: bash
      run: just setup
      env:
        GITHUB_TOKEN: ${{ github.token }}
